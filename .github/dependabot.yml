# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Actions are pinned to commit SHAs for supply-chain reasons, so Dependabot is
  # the mechanism that keeps them current — without it the pins silently rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Both Dockerfiles pin their base image by digest; nothing else would notice a
  # rebased upstream image.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # src/3rdparty/spdlog was pinned to a 2021 commit. This is the only automated
  # signal that it has fallen behind again.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"

  # No pip entry: Dependabot needs a manifest, and the bare
  # `pip install osxrelocator` in macos-build.yml is invisible to it. An entry
  # here would look like coverage without providing any.

name: Windows Qt 6 build test

on:
  push:
    branches: [master]
    tags: ['windows-v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-qt6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - name: Install matching UCRT64 compiler, Qt 6 and GStreamer
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-networkauth
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-gst-libav
      - name: Record development environment
        run: |
          mkdir -p build-windows-dev
          pacman -Q > build-windows-dev/environment.txt
          cmake --version
          g++ --version
          pkg-config --modversion gstreamer-1.0
          for element in pitch equalizer-10bands cdgparse cdgdec avdec_h264; do
            gst-inspect-1.0 "$element"
          done
      - name: Validate Windows preview tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PYTHON'
          import os, pathlib, re
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/'):
              match = re.fullmatch(r'refs/tags/windows-v(\d+\.\d+\.\d+)-(?:prerelease|preview)\.\d+', ref)
              if not match:
                  raise SystemExit('Expected windows-vX.Y.Z-prerelease.N or windows-vX.Y.Z-preview.N')
              header = pathlib.Path('src/okjversion.h').read_text(encoding='utf-8')
              version = re.search(r'OKJ_VERSION_STRING "([^"\n]+)"', header).group(1)
              parts = [re.search(r'OKJ_VERSION_' + part + r' (\d+)', header).group(1)
                       for part in ('MAJOR', 'MINOR', 'BUILD')]
              if version != match[1] or '.'.join(parts) != version:
                  raise SystemExit('Windows tag and source version do not match')
              if not pathlib.Path('packaging/WINDOWS_RELEASE_NOTES.md').read_text(encoding='utf-8').startswith('# OpenKJ ' + version + ' —'):
                  raise SystemExit('Update packaging/WINDOWS_RELEASE_NOTES.md for this version')
          PYTHON
      - name: Configure Qt 6 build
        run: >-
          cmake -S . -B build-windows-dev -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DOPENKJ_BUILD_SMOKE_TESTS=ON
      - name: Build application and runtime checks
        run: cmake --build build-windows-dev --parallel 4
      - name: Check Qt, SQLite, CDG and SoundTouch audio
        run: |
          export QT_DEBUG_PLUGINS=1
          # windeployqt deploys qwindows for the app; the headless check also
          # needs qoffscreen from the installed SDK's plugin directory.
          export QT_PLUGIN_PATH="$(qmake6 -query QT_INSTALL_PLUGINS)"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/run_windows_checks.ps1
      - name: Stage self-contained Windows preview
        run: python packaging/package_windows.py --prefix /ucrt64
      - name: Check bundled runtime without installed SDK paths
        shell: pwsh
        run: ./packaging/check_windows_bundle.ps1
      - name: Archive Windows preview
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OpenKJ-Windows-x64-preview -DestinationPath dist/OpenKJ-Windows-x64-preview.zip
          (Get-FileHash dist/OpenKJ-Windows-x64-preview.zip -Algorithm SHA256).Hash.ToLower() + '  OpenKJ-Windows-x64-preview.zip' |
            Set-Content dist/OpenKJ-Windows-x64-preview.zip.sha256
          Copy-Item packaging/WINDOWS_RELEASE_NOTES.md dist/WINDOWS_RELEASE_NOTES.md
      - name: Upload self-contained Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: OpenKJ-Windows-x64-preview
          path: |
            dist/OpenKJ-Windows-x64-preview.zip
            dist/OpenKJ-Windows-x64-preview.zip.sha256
            dist/WINDOWS_RELEASE_NOTES.md
          if-no-files-found: error
      - name: Upload development build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenKJ-Windows-x64-development
          path: |
            build-windows-dev/*.exe
            build-windows-dev/*.dll
            build-windows-dev/platforms/
            build-windows-dev/sqldrivers/
            build-windows-dev/environment.txt
            build-windows-dev/Testing/Temporary/LastTest.log
            build-windows-dev/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/windows-v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenKJ-Windows-x64-preview
          path: release
      - name: Attach verified Windows ZIP and publish prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check OpenKJ-Windows-x64-preview.zip.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.zip ./*.zip.sha256
          else
            VERSION="${RELEASE_TAG#windows-v}"
            VERSION="${VERSION%%-*}"
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
              --title "OpenKJ $VERSION — Windows x64 Preview" --notes-file WINDOWS_RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" ./*.zip ./*.zip.sha256
            gh release edit "$RELEASE_TAG" --draft=false
          fi

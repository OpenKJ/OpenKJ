name: Linux Flatpak preview

on:
  push:
    branches: [macos-qt6-test]
    paths:
      - '.github/workflows/linux-flatpak.yml'
      - 'packaging/flatpak/**'
      - 'packaging/build_flatpak.sh'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'packaging/runtime_smoke.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build and test installable Flatpak preview
        env:
          OPENKJ_FLATPAK_SYSTEM: '1'
        run: |
          set -o pipefail
          # The SDK container and Actions checkout use different home/UID
          # contexts. Trust only this runner-mounted source checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash packaging/build_flatpak.sh 2>&1 | tee build-flatpak.log
      - name: Upload installable Linux preview
        uses: actions/upload-artifact@v4
        with:
          name: OpenKJ-Linux-x86_64-flatpak-preview
          path: releases/flatpak/
          if-no-files-found: error
      - name: Upload Flatpak build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenKJ-flatpak-diagnostics
          path: |
            build-flatpak.log
            packaging/flatpak/org.openkj.OpenKJ.json

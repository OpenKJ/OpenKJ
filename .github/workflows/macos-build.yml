name: Apple Silicon build and release

on:
  push:
    branches: [master]
    tags: ['macos-v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/'):
              tag = ref.removeprefix('refs/tags/')
              match = re.fullmatch(r'(?:macos-)?v(\d+\.\d+\.\d+)-(?:prerelease|preview)\.\d+', tag)
              if not match:
                  raise SystemExit('Expected vX.Y.Z-prerelease.N, vX.Y.Z-preview.N, or a macos-prefixed platform tag')
              header = pathlib.Path('src/okjversion.h').read_text()
              version = re.search(r'OKJ_VERSION_STRING "([^"\n]+)"', header).group(1)
              parts = [re.search(r'OKJ_VERSION_' + part + r' (\d+)', header).group(1)
                       for part in ('MAJOR', 'MINOR', 'BUILD')]
              if version != match[1] or '.'.join(parts) != version:
                  raise SystemExit('Release tag and source version do not match')
              notes = pathlib.Path('packaging/RELEASE_NOTES.md').read_text()
              if not notes.startswith('# OpenKJ ' + version + ' —'):
                  raise SystemExit('Update packaging/RELEASE_NOTES.md for this version')
          PYTHON
      - name: Set up native development dependencies
        run: ./packaging/setup_macos.sh
      - name: Build and run isolated runtime checks
        run: |
          source build-macos-deps/env.sh
          cmake -S . -B build-macos-dev -DOPENKJ_BUILD_SMOKE_TESTS=ON
          cmake --build build-macos-dev --target openkj-runtime-smoke --parallel 4
          ctest --test-dir build-macos-dev --output-on-failure
      - name: Build and sign standalone app
        run: |
          source build-macos-deps/env.sh
          ./packaging/build_macos.sh
      - name: Create and verify DMG
        run: ./packaging/create_dmg.sh
      - name: Prepare checksum and release notes
        run: |
          source build-macos-deps/env.sh
          python3 - <<'PYTHON'
          import hashlib, os, pathlib
          dmg, = pathlib.Path('releases').glob('*.dmg')
          digest = hashlib.file_digest(dmg.open('rb'), 'sha256').hexdigest()
          dmg.with_suffix('.dmg.sha256').write_text(f'{digest}  {dmg.name}\n')
          notes = pathlib.Path('packaging/RELEASE_NOTES.md').read_text()
          source = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/commit/' + os.environ['GITHUB_SHA']
          notes += f'\nSource: [release commit]({source}).\n\nDMG SHA-256: `{digest}`\n'
          pathlib.Path('releases/RELEASE_NOTES.md').write_text(notes)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: OpenKJ-macos-arm64
          path: releases/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-environment
          path: build-macos-deps/environment.txt
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/macos-v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenKJ-macos-arm64
          path: release
      - name: Attach verified DMG and publish prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check -- *.dmg.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Do not overwrite an already published asset on a rerun.
            gh release upload "$RELEASE_TAG" ./*.dmg ./*.dmg.sha256
          else
            VERSION="${RELEASE_TAG#macos-v}"
            VERSION="${VERSION%%-*}"
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
              --title "OpenKJ $VERSION — Apple Silicon Pre-release" --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" ./*.dmg ./*.dmg.sha256
            gh release edit "$RELEASE_TAG" --draft=false
          fi

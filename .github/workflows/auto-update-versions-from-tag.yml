name: Update versions from tag

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  update-build-files:
    runs-on: ubuntu-latest
    permissions:
      # Needed by test-room-7/action-update-file to commit the version bump.
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - id: get_version
        uses: dhkatz/get-version-action@9166b8a614609209809cdef096d62b39287139cb # v3.0.0

      - name: Setup OpenKJ verion env vars
        # Tag-derived values are passed through env rather than interpolated into
        # the script body: `${{ }}` is substituted textually before bash parses
        # the line, so a crafted tag could otherwise inject shell commands into a
        # job that holds repository write access.
        env:
          IS_SEMVER: ${{ steps.get_version.outputs.is-semver }}
          PRERELEASE: ${{ steps.get_version.outputs.prerelease }}
          VERSION_WITHOUT_V: ${{ steps.get_version.outputs.version-without-v }}
        run: |
          BRANCH=${GITHUB_REF##*/}
          if [ "$BRANCH" = "master" ];then
            RTYPE="unstable"
          elif [ "$BRANCH" = "stable" ];then
            RTYPE="release"
          else
            RTYPE=$BRANCH
          fi
          OKJVER=`grep VERSION_STRING src/okjversion.h | cut -d'"' -f2`

          if [ "$IS_SEMVER" = "true" ];then
            if [ "$PRERELEASE" = "" ];then
              RTYPE="release"
              BRANCH="release"
            elif [ "$PRERELEASE" = "unstable" ];then
              RTYPE="unstable"
              BRANCH="master"
            else
              RTYPE="$PRERELEASE"
              BRANCH="master"
            fi
            OKJVER="$VERSION_WITHOUT_V"
          fi
          BLDDATE=$(date +'%Y-%m-%d')
          echo "branch=${BRANCH}" >> $GITHUB_ENV
          echo "rtype=${RTYPE}" >> $GITHUB_ENV
          echo "okjver=${OKJVER}" >> $GITHUB_ENV
          echo "blddate=${BLDDATE}" >> $GITHUB_ENV
          echo "OpenKJ Version: $OKJVER"
        shell: bash

      - name: Update Windows installer config files
        env:
          VERSION_WITHOUT_V: ${{ steps.get_version.outputs.version-without-v }}
        run: |
          sed -i "s/#define MyAppVersion.*/#define MyAppVersion \"${VERSION_WITHOUT_V}\"/" cd/openkj32.iss
          sed -i "s/#define MyAppVersion.*/#define MyAppVersion \"${VERSION_WITHOUT_V}\"/" cd/openkj64.iss

      - name: Update okjversion.h
        env:
          MAJOR: ${{ steps.get_version.outputs.major }}
          MINOR: ${{ steps.get_version.outputs.minor }}
          PATCH: ${{ steps.get_version.outputs.patch }}
        run: |
          echo "Updating okjversion.h"
          echo "#ifndef OKJVERSION_H" > src/okjversion.h
          echo "#define OKJVERSION_H" >> src/okjversion.h
          echo >> src/okjversion.h
          echo "#define OKJ_VERSION_MAJOR ${MAJOR}" >> src/okjversion.h
          echo "#define OKJ_VERSION_MINOR ${MINOR}" >> src/okjversion.h
          echo "#define OKJ_VERSION_BUILD ${PATCH}" >> src/okjversion.h
          echo "#define OKJ_VERSION_STRING \"${MAJOR}.${MINOR}.${PATCH}\"" >> src/okjversion.h
          # rtype already reached the environment via GITHUB_ENV in the step above.
          echo "#define OKJ_VERSION_BRANCH \"${rtype}\"" >> src/okjversion.h
          echo >> src/okjversion.h
          echo "#endif //OKJVERSION_H" >> src/okjversion.h

      - name: Commit changes to repo
        uses: test-room-7/action-update-file@6b8249d09d5926fbae288c0bb640757f09ec7ce0 # v2
        with:
          file-path: |
            src/okjversion.h
            cd/openkj32.iss
            cd/openkj64.iss
          commit-msg: Auto commit - update version from git tag
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.branch }}

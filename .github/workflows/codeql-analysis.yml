name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '34 16 3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config zlib1g-dev \
            qt6-base-dev qt6-svg-dev qt6-multimedia-dev qt6-networkauth-dev \
            qt6-websockets-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build Qt 6 application for analysis
        run: |
          cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-codeql --parallel 4
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
